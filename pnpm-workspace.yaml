packages:
  - '.'

allowBuilds:
  esbuild@0.28.2: true

# Keep dependency security overrides in this file so pnpm records one canonical set.
overrides:
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr — brace-expansion
  # below 5.0.12. Direct dependency, and minimatch. Remove once every copy is
  # >=5.0.12 (check: pnpm why brace-expansion).
  brace-expansion@<5.0.12: '>=5.0.12 <6'
  postcss@<8.5.23: '>=8.5.23 <9'
  # GHSA-2v37-7h3g-55p8 / CVE-2026-67213 — nanoid infinite loop on size=0. Dev-only
  # (transitive via postcss). Remove once transitive nanoid is >=3.3.17
  # (check: pnpm why nanoid).
  nanoid@<3.3.17: '>=3.3.17 <4'
